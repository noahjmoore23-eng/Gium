name: CI

on:
  push:
    branches: ['**']
  pull_request:

# This workflow only reads the checkout — it never writes to the repo, publishes
# a package, or touches the branch GitHub Pages serves from. Declaring that here
# stops GITHUB_TOKEN inheriting whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
